$:
  push:
    # 导入密钥仓库文件为环境变量
    - imports:
        - https://cnb.cool/liweijie0812/secret/-/blob/main/token.yml
      stages:
        - name: sync to github with rebase
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/liweijie0812/tdesign-skills
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}

  vscode:
    - docker:
        build: .cnb/Dockerfile
      services:
        - vscode
        - docker
  
